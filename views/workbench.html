<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laya 虚拟环境工坊</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main aria-label="Laya 虚拟环境工坊">
      <div class="header">
        <div>
          <h1 class="title">Laya 虚拟环境工坊</h1>
          <p class="subtitle">虚拟环境出成品（laya-env） · 主模型零噪声取货（.laya/artifacts）</p>
        </div>
        <button type="button" id="btn-refresh" class="btn" aria-label="刷新成品列表">刷新成品</button>
      </div>

      <div id="warn-banner" class="alert-banner" role="alert" hidden></div>

      <section class="grid" aria-label="会话运行统计">
        <div class="stat" role="group" aria-labelledby="lbl-artifacts">
          <div class="stat-label" id="lbl-artifacts">就绪成品</div>
          <div class="stat-val" id="stat-artifacts" aria-live="polite">0</div>
        </div>
        <div class="stat" role="group" aria-labelledby="lbl-calls">
          <div class="stat-label" id="lbl-calls">会话步数</div>
          <div class="stat-val" id="stat-calls" aria-live="polite">0</div>
        </div>
        <div class="stat" role="group" aria-labelledby="lbl-dup">
          <div class="stat-label" id="lbl-dup">连续重复命令</div>
          <div class="stat-val" id="stat-dup" aria-live="polite">0</div>
        </div>
        <div class="stat" role="group" aria-labelledby="lbl-preview">
          <div class="stat-label" id="lbl-preview">预览空转连击</div>
          <div class="stat-val" id="stat-preview" aria-live="polite">0</div>
        </div>
      </section>

      <section class="panel" aria-labelledby="artifacts-heading">
        <h2 class="panel-title" id="artifacts-heading">成品仓库（.laya/artifacts）</h2>
        <div id="artifact-list" class="list" role="list" aria-live="polite">
          <div class="empty">加载中…</div>
        </div>
      </section>

      <section class="panel" id="detail-panel" aria-labelledby="detail-title" hidden>
        <div class="header">
          <h2 class="panel-title" id="detail-title">成品内容</h2>
          <div class="row" id="file-tabs" role="tablist" aria-label="成品文件切换"></div>
        </div>
        <pre class="code-box" id="detail-body" tabindex="0" aria-live="polite"></pre>
      </section>
    </main>

    <script type="module" src="./workbench.js"></script>
  </body>
</html>
